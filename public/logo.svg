<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Arched text BARBERS -->
  <path id="barbers-arc" d="M 140 230 A 130 130 0 0 1 360 230" fill="none" stroke="none" />
  <text font-family="'Inter', 'Playfair Display', -apple-system, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="0.45em">
    <textPath href="#barbers-arc" startOffset="50%" text-anchor="middle">
      BARBERS
    </textPath>
  </text>

  <!-- Left flank: dot and 2 horizontal lines -->
  <circle cx="165" cy="238" r="3.5" fill="#FFFFFF" />
  <line x1="185" y1="228" x2="222" y2="228" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="185" y1="254" x2="222" y2="254" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right flank: dot and 2 horizontal lines -->
  <circle cx="335" cy="238" r="3.5" fill="#FFFFFF" />
  <line x1="278" y1="228" x2="315" y2="228" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="278" y1="254" x2="315" y2="254" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Crossed Barber Shears (Scissors) -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Blade 1: Loop top left to blade tip bottom right -->
    <ellipse cx="232" cy="214" rx="9" ry="12" stroke-width="4.5" transform="rotate(-15 232 214)" />
    <!-- tang / finger rest -->
    <path d="M 219 204 C 215 200 216 195 220 193" stroke-width="3" />
    <path d="M 235 225 L 285 272" stroke-width="4.5" />

    <!-- Blade 2: Loop top right to blade tip bottom left -->
    <ellipse cx="268" cy="214" rx="9" ry="12" stroke-width="4.5" transform="rotate(15 268 214)" />
    <path d="M 265 225 L 215 272" stroke-width="4.5" />

    <!-- Center pivot rivet -->
    <circle cx="250" cy="239" r="3" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- URBAN Cartouche Banner (outer notched box) -->
  <!-- Classic barber badge with concave notched corners -->
  <path d="
    M 130 276
    L 370 276
    A 14 14 0 0 1 384 290
    L 384 328
    A 14 14 0 0 1 370 342
    L 130 342
    A 14 14 0 0 1 116 328
    L 116 290
    A 14 14 0 0 1 130 276
    Z"
    fill="none" stroke="#FFFFFF" stroke-width="3.5"
  />

  <!-- Inner inset border line -->
  <path d="
    M 133 282
    L 367 282
    A 8 8 0 0 1 375 290
    L 375 328
    A 8 8 0 0 1 367 336
    L 133 336
    A 8 8 0 0 1 125 328
    L 125 290
    A 8 8 0 0 1 133 282
    Z"
    fill="none" stroke="#FFFFFF" stroke-width="1.8"
  />

  <!-- URBAN Bold Serif Text -->
  <text x="250" y="322" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="46" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.08em">
    URBAN
  </text>
</svg>
